<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/png" href="/lauftrainer-strava-icon.png" />
    <link rel="apple-touch-icon" href="/lauftrainer-strava-icon.png" />
    <title>LaufTrainer</title>
    <script>
      ;(() => {
        const preference = localStorage.getItem('lauftrainer-theme') || 'dark'
        const dark =
          preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
